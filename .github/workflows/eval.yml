name: evals

# Manual only: evals call the real Gemini API and use quota.
on:
  workflow_dispatch:
    inputs:
      only:
        description: "Comma-separated case IDs (empty = all)"
        required: false
        default: ""

jobs:
  eval:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: go test -tags eval -count=1 -timeout 45m -v ./evals/...
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LLM_MODEL: ${{ vars.LLM_MODEL || 'gemini-3.8-flash' }}
          EVAL_ONLY: ${{ inputs.only }}
